# ~/.config/devflow/config.yml —— 本机配置，不进任何仓库
browser:
  cdp_url_env: DEVFLOW_BROWSER_CDP   # 存 CDP 地址的环境变量名；值形如 http://10.0.0.5:9222
  host: ""                           # 浏览器那台机器访问“这台机器”用的地址（局域网 / Tailscale IP）
  # ssh_host: ""                     # 可选：访问不到时，用 SSH 反向隧道（在这台机器上执行）
preview:
  vibeview: auto                      # auto：装了 dview 且配置了 DVIEW_URL 就用；off：不用
