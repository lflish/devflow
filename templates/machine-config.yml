# ~/.config/devflow/config.yml —— 本机配置，不进任何仓库，可以写真实地址
browser:
  provider: local                    # local（本机无头）/ cdp（自己的另一台机器）/ steel / kernel（云浏览器，只能测公网地址）
  cdp_url_env: DEVFLOW_BROWSER_CDP   # provider=cdp 时，CDP 地址所在的环境变量
  key_env: ""                        # provider=steel/kernel 时，API key 所在的环境变量名，例如 CHROME_KEY
  host: ""                           # 浏览器那台机器访问“这台机器”用的地址
  # ssh_host: ""                     # 可选：访问不到时，在这台机器上建反向隧道
preview:
  vibeview: auto
notify:                              # 不写时：有推送工具（Claude Code）就用，否则有 webhook 就用，否则不通知
  # webhook_env: DEVFLOW_NOTIFY_WEBHOOK   # webhook 地址所在的环境变量
  # payload: feishu                       # slack / feishu / wecom / ntfy / raw
variants: 4                          # 口味类决定的多方案对比页最多几个方案
budget:                              # 花费上限（按需求、按天或按次，见各项），超出就停下记 c<n> 等你
  verify_rounds_per_change: 6
  external_model_calls_per_change: 20
  cloud_browser_minutes_per_day: 60
  experiment_model_calls: 30
verify:
  models: [codex, claude, same]      # 验证者候选，按顺序探测：同级别的其他模型优先（可写 codex:<模型>、claude:<模型>），最后 same
  probe_timeout: 60
  run_timeout: 1800

projects:
  # /home/you/github/your-project:   # 键是仓库根目录的绝对路径
  #   autonomy: L2
  #   environments:
  #     local:   { url: http://192.168.1.20:3000 }
  #     staging: { url: https://staging.internal.example.com }
